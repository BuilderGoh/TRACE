services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trace_dev
      POSTGRES_PASSWORD: ${TRACE_DEV_POSTGRES_PASSWORD:-trace-dev-only}
      POSTGRES_DB: trace_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace_dev -d trace_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://trace_dev:${TRACE_DEV_POSTGRES_PASSWORD:-trace-dev-only}@postgres:5432/trace_dev?sslmode=disable
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-openai}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-bedrock.gpt-5.6-luna}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-https://nc3.csa.gov.sg/kepler/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_ADMIN_PASSWORD: ${ARTEX_ADMIN_PASSWORD:-}
      ARTEX_LANG: ${ARTEX_LANG:-en}
    ports:
      - "127.0.0.1:18787:8787"
      - "127.0.0.1:18788:8788"
    volumes:
      - appdata:/app/data
      - ./skills:/app/skills

volumes:
  pgdata:
  appdata:
